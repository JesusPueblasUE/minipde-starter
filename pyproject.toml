[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minipde"
version = "0.1.0"
description = "Educational PDE solver developed incrementally"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "JESUS PUEBLAS SANCHEZ-GUERRA" }
]
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8"
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"